name: Test

on:
  push:
    branches:
      - vapor4
  pull_request:
    branches:
      - vapor4

jobs:
  linux:
    name: Test on Linux - ${{ matrix.swift-image }}
    strategy:
      matrix:
        swift-image:
          - "swift:6.1-jammy"
          - "swift:6.1-noble"
          - "swift:6.2-jammy"
          - "swift:6.2-noble"
          - "swift:6.3-jammy"
          - "swift:6.3-noble"
          - "swift:6.4-jammy"
          - "swift:6.4-noble"
    runs-on: ubuntu-latest
    container: ${{ matrix.swift-image }}
    services:
      valkey:
        image: valkey/valkey:9
    env:
      VALKEY_HOSTNAME: valkey
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Test
      run: |
        swift test
